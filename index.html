<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07170f">
<title>Avstemning</title>
<style>
  :root { --bg: #07170f; --panel: #0f2a1c; --line: #1f4a33; --text: #f3efe2; --muted: #9db3a4; --gold: #e8c15a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #17402a 0%, var(--bg) 60%) fixed var(--bg);
    color: var(--text); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-family: "Avenir Next Condensed", "Arial Narrow", Impact, sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; font-size: 34px; line-height: 1.05; margin: 8px 0; color: var(--gold); }
  .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; min-height: 24px; }
  .top button { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; padding: 6px 0; }
  .muted { color: var(--muted); }
  input {
    width: 100%; font-size: 20px; padding: 16px; border-radius: 14px; border: 2px solid var(--line);
    background: var(--panel); color: var(--text);
  }
  input:focus { outline: 0; border-color: var(--gold); }
  .btn {
    width: 100%; font: inherit; font-size: 20px; font-weight: 700; padding: 18px; border-radius: 14px; border: 0;
    background: var(--gold); color: #1b1503; touch-action: manipulation;
  }
  .opt {
    position: relative; overflow: hidden; width: 100%; text-align: left; font: inherit; font-size: 20px; font-weight: 700;
    padding: 20px 18px; border-radius: 16px; border: 2px solid var(--line); background: var(--panel); color: var(--text);
    touch-action: manipulation; transition: transform .1s, border-color .15s;
  }
  button.opt:active { transform: scale(.97); }
  .opt.mine { border-color: var(--gold); box-shadow: 0 0 24px #e8c15a55; }
  .opt.win { border-color: var(--gold); }
  .opt .fill { position: absolute; inset: 0 auto 0 0; background: #e8c15a33; transition: width 1s cubic-bezier(.2, 1, .3, 1); }
  .opt.win .fill { background: #e8c15a66; }
  .opt .line { position: relative; display: flex; justify-content: space-between; gap: 12px; }
  .opt .who { position: relative; font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 4px; }
  .wait { text-align: center; padding: 60px 0; font-size: 20px; }
  .wait .ball { font-size: 56px; display: block; margin-bottom: 14px; animation: bounce 1s ease-in-out infinite alternate; }
  @keyframes bounce { to { transform: translateY(-16px); } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const URL_ = 'https://bdzhjlnzlmibndqxwxtr.supabase.co', KEY = 'sb_publishable_dk2JzLzlHaSY3g0qHiH1mA_WLr_4nfK';
const app = document.getElementById('app');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128;
  const x = [...b].map(v => v.toString(16).padStart(2, '0')).join('');
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
}
let voterId = store.get('voterId');
if (!voterId) { voterId = uuid(); store.set('voterId', voterId); }
let name = store.get('voterName') || '', nick = store.get('voterNick') || '', hcp = store.get('voterHcp') || '', editing = !name;
let poll = null, results = null, myChoice = null, shown = '', busy = false;

function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
async function api(path, body) {
  const r = await fetch(URL_ + '/rest/v1/' + path, {
    method: body ? 'POST' : 'GET',
    headers: { apikey: KEY, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error((await r.text()) || r.status);
  return r.status === 204 ? null : r.json();
}

function render() {
  // Tegn bare på nytt når noe faktisk har endret seg, så knapper ikke blinker
  const key = JSON.stringify([name, nick, hcp, editing, poll, results, myChoice]);
  if (key === shown) return;
  shown = key;
  app.innerHTML = '';

  if (editing) {
    const input = h('input'), nickInput = h('input'), hcpInput = h('input'), btn = h('button', 'btn', name ? 'Lagre' : 'Bli med');
    hcpInput.placeholder = 'Handicap (f.eks. 18,4)';
    hcpInput.inputMode = 'decimal';
    hcpInput.maxLength = 5;
    hcpInput.value = hcp;
    input.placeholder = 'Navnet ditt';
    input.maxLength = 30;
    input.value = name;
    nickInput.placeholder = 'Kallenavn eller slagord (vises på storskjermen)';
    nickInput.maxLength = 40;
    nickInput.value = nick;
    const join = async () => {
      const v = input.value.trim();
      if (!v || busy) return;
      busy = true;
      btn.textContent = 'Lagrer …';
      try {
        const body = { p_voter_id: voterId, p_name: v, p_nick: nickInput.value.trim(), p_hcp: hcpInput.value.trim() };
        try { await api('rpc/register_player', body); }
        catch (e) {
          // Databasen har ikke fått hcp-feltet ennå: registrer uten
          if (!String(e.message).includes('PGRST202')) throw e;
          delete body.p_hcp;
          await api('rpc/register_player', body);
        }
        name = v;
        nick = nickInput.value.trim();
        hcp = hcpInput.value.trim();
        store.set('voterName', name);
        store.set('voterNick', nick);
        store.set('voterHcp', hcp);
        editing = false;
      } catch (e) { alert('Klarte ikke å lagre. Sjekk nettet og prøv igjen.'); }
      busy = false;
      shown = '';
      render();
    };
    btn.onclick = join;
    app.append(h('h1', '', 'Hvem er du?'), input, nickInput, hcpInput, btn);
    return;
  }

  const top = h('div', 'top'), change = h('button', '', 'Endre navn');
  change.onclick = () => { editing = true; render(); };
  top.append(h('span', '', 'Du er ' + name + (nick ? ' «' + nick + '»' : '')), change);
  app.append(top);

  if (!poll) {
    const w = h('div', 'wait muted');
    w.append(h('span', 'ball', '⛳'), 'Venter på neste avstemning …');
    app.append(w);
    return;
  }

  app.append(h('h1', '', poll.question));
  const closed = poll.status === 'closed';
  const counts = closed && results ? results.counts : null;
  const max = counts ? Math.max(1, ...counts) : 1, best = counts ? Math.max(...counts) : -1;
  poll.options.forEach((o, i) => {
    const b = h(closed ? 'div' : 'button', 'opt' + (myChoice === i ? ' mine' : ''));
    const line = h('div', 'line');
    line.append(h('span', '', o));
    if (counts) {
      const fill = h('div', 'fill');
      fill.style.width = (counts[i] / max * 100) + '%';
      b.append(fill);
      line.append(h('span', '', counts[i]));
      if (best > 0 && counts[i] === best) b.classList.add('win');
    }
    b.append(line);
    if (counts) b.append(h('div', 'who', results.by_choice[i].join(', ')));
    if (!closed) b.onclick = () => vote(i);
    app.append(b);
  });
  app.append(h('div', 'muted', closed
    ? 'Avstemningen er avsluttet.'
    : myChoice == null ? 'Trykk for å stemme. Resultatet vises når verten avslutter.'
    : 'Stemmen din er registrert ✓ Du kan endre den til verten avslutter.'));
}

async function vote(i) {
  if (busy) return;
  busy = true;
  const before = myChoice;
  myChoice = i;
  render();
  try {
    await api('rpc/cast_vote', { p_poll_id: poll.id, p_voter_id: voterId, p_name: name, p_choice: i });
    store.set('choice-' + poll.id, i);
  } catch (e) {
    myChoice = before;
    render();
    alert('Stemmen gikk ikke gjennom. Prøv igjen.');
  }
  busy = false;
}

async function tick() {
  try {
    const rows = await api('polls?select=id,question,options,status&order=id.desc&limit=1');
    const p = rows[0] || null;
    if (!p || !poll || p.id !== poll.id) {
      const saved = p ? store.get('choice-' + p.id) : null;
      myChoice = saved == null ? null : +saved;
      results = null;
    }
    poll = p;
    if (p && p.status === 'closed' && !results) results = await api('rpc/poll_results', { p_poll_id: p.id });
    if (!editing) render();
  } catch (e) {}
}
render();
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
